# yazi theme: gruvbox-material surfaces with the hues of helix's default theme,
# custom-cat-plus (modules/home/helix). Keep the two in step.
# Only colours are set here; yazi keeps its default symbols and layout.
#
#   bg0 #1d2021  bg1 #282828  bg2 #32302f  bg3 #3c3836  bg4 #504945
#   grey #928374  fg #ebdbb2  fg1 #d4be98
#   red #ff514f  orange #f87e1d  yellow #e3a228  green #a8b847
#   aqua #7fb876  blue #6fb1a3  purple #e07c9a

[mgr]
cwd = { fg = "#6fb1a3", bold = true }

find_keyword  = { fg = "#e3a228", bold = true, underline = true }
find_position = { fg = "#e07c9a", bold = true }

marker_copied   = { fg = "#a8b847", bg = "#a8b847" }
marker_cut      = { fg = "#ff514f", bg = "#ff514f" }
marker_marked   = { fg = "#7fb876", bg = "#7fb876" }
marker_selected = { fg = "#e3a228", bg = "#e3a228" }

count_copied   = { fg = "#1d2021", bg = "#a8b847" }
count_cut      = { fg = "#1d2021", bg = "#ff514f" }
count_selected = { fg = "#1d2021", bg = "#e3a228" }

border_style = { fg = "#504945" }

[indicator]
parent  = { fg = "#ebdbb2", bg = "#3c3836" }
current = { fg = "#1d2021", bg = "#e3a228", bold = true }
preview = { fg = "#ebdbb2", bg = "#3c3836" }

[tabs]
active   = { fg = "#1d2021", bg = "#6fb1a3", bold = true }
inactive = { fg = "#928374", bg = "#32302f" }

[mode]
normal_main = { fg = "#1d2021", bg = "#6fb1a3", bold = true }
normal_alt  = { fg = "#6fb1a3", bg = "#32302f" }
select_main = { fg = "#1d2021", bg = "#e07c9a", bold = true }
select_alt  = { fg = "#e07c9a", bg = "#32302f" }
unset_main  = { fg = "#1d2021", bg = "#ff514f", bold = true }
unset_alt   = { fg = "#ff514f", bg = "#32302f" }

[status]
perm_sep   = { fg = "#504945" }
perm_type  = { fg = "#6fb1a3" }
perm_read  = { fg = "#e3a228" }
perm_write = { fg = "#ff514f" }
perm_exec  = { fg = "#a8b847" }
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#a8b847", bg = "#32302f" }
progress_error  = { fg = "#ff514f", bg = "#32302f" }

[which]
mask            = { bg = "#282828" }
cand            = { fg = "#7fb876" }
rest            = { fg = "#928374" }
desc            = { fg = "#e07c9a" }
separator_style = { fg = "#504945" }

[confirm]
border  = { fg = "#6fb1a3" }
title   = { fg = "#6fb1a3" }
btn_yes = { fg = "#1d2021", bg = "#e3a228" }

[spot]
border   = { fg = "#6fb1a3" }
title    = { fg = "#6fb1a3" }
tbl_col  = { fg = "#6fb1a3" }
tbl_cell = { fg = "#1d2021", bg = "#e3a228" }

[notify]
title_info  = { fg = "#a8b847" }
title_warn  = { fg = "#e3a228" }
title_error = { fg = "#ff514f" }

[pick]
border = { fg = "#6fb1a3" }
active = { fg = "#e07c9a", bold = true }

[input]
border   = { fg = "#6fb1a3" }
selected = { fg = "#1d2021", bg = "#e3a228" }

[cmp]
border = { fg = "#6fb1a3" }
active = { fg = "#1d2021", bg = "#e3a228" }

[tasks]
border  = { fg = "#6fb1a3" }
hovered = { fg = "#e07c9a", bold = true }

[help]
on      = { fg = "#7fb876" }
run     = { fg = "#e07c9a" }
hovered = { fg = "#1d2021", bg = "#e3a228", bold = true }
footer  = { fg = "#1d2021", bg = "#d4be98" }

[filetype]
rules = [
  # explainers
  { url = "*.png", fg = "#e3a228" },
  { url = "*.svg", fg = "#e3a228" },
  { url = "*.md",  fg = "#7fb876" },
  { url = "*.ans", fg = "#f87e1d" },
  # general
  { mime = "image/*", fg = "#e3a228" },
  { mime = "{audio,video}/*", fg = "#e07c9a" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff514f" },
  { mime = "application/{pdf,doc,rtf}", fg = "#7fb876" },
  { mime = "vfs/{absent,stale}", fg = "#928374" },
  { url = "*", is = "orphan", fg = "#ff514f" },
  { url = "*", is = "exec", fg = "#a8b847" },
  { url = "*/", fg = "#6fb1a3" },
]
