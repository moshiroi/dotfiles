# yazi config (linked out of store from modules/home/explain/yazi).
# Opens images and explainers inside the terminal instead of Preview.app,
# the browser or the editor. The old behaviour stays on `o` (open with…).

[opener]
view = [
  { run = "explain-view %s1", block = true, desc = "View in terminal", for = "unix" },
]

[open]
prepend_rules = [
  # images anywhere: draw them in the terminal
  { url = "*.{png,jpg,jpeg,gif}", use = [ "view", "open" ] },
  { url = "*.svg", use = [ "view", "edit", "open" ] },
  # explainer documents: read them; elsewhere .md still opens the editor
  { url = "**/explainers/**/*.{md,ans}", use = [ "view", "edit" ] },
  { url = "*.ans", use = [ "view", "edit" ] },
]

[plugin]
prepend_previewers = [
  { url = "*.md",  run = "explain" },
  { url = "*.ans", run = "explain" },
]
