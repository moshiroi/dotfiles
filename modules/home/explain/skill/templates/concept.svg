<svg xmlns="http://www.w3.org/2000/svg" width="840" height="950" viewBox="0 0 840 950">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#a8a295" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text  { font-family: Charter, Georgia, serif; fill: #d6d0c2; }
    .title{ font-size: 34px; }
    .sub  { font-size: 18px; fill: #a8a295; }
    .sec  { font-size: 14px; letter-spacing: 2.4px; fill: #857f73; }
    .h    { font-size: 22px; }
    .w    { font-size: 19px; }
    .n    { font-size: 16px; fill: #a8a295; }
    .m    { font-size: 16px; fill: #a8a295; }
    .c    { font-family: 'JetBrainsMono Nerd Font', Menlo, monospace; font-size: 16px; fill: #bfb9ab; font-variant-ligatures: none; }
    .ink  { fill: none; stroke: #a8a295; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .lead { fill: none; stroke: #78746a; stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; }
    .rule { stroke: #32302d; stroke-width: 1; }
  </style>

  <rect width="840" height="950" fill="#201f1d"/>

  <text x="48" y="74" class="title">How flingd search works</text>
  <text x="48" y="106" class="sub">Two ways of finding a save, run side by side and merged by rank.</text>
  <line x1="48" y1="136" x2="792" y2="136" class="rule"/>
  <line x1="568" y1="160" x2="568" y2="920" class="rule"/>

  <!-- I. INDEX -->
  <text x="48" y="182" class="sec">I · INDEX</text>

  <text x="48" y="232" class="c" style="font-size:17px;fill:#d6d0c2">links</text>
  <path d="M106 226 H232" class="ink" marker-end="url(#a)"/>
  <g class="ink"><ellipse cx="254" cy="216" rx="11" ry="4"/><path d="M243 216 V238 A11 4 0 0 0 265 238 V216"/></g>
  <text x="276" y="230" class="c" style="font-size:15px">tsvector</text>
  <text x="276" y="252" class="n">+ pg_trgm on url</text>

  <path d="M70 244 V282" class="ink" marker-end="url(#a)"/>
  <text x="48" y="308" class="w">Job queue</text>
  <path d="M70 320 V358" class="ink" marker-end="url(#a)"/>
  <text x="48" y="384" class="w">Embed worker</text>
  <path d="M184 378 H234" class="ink" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="246" y="384" class="w">Gemini</text>

  <path d="M70 396 V428" class="ink" marker-end="url(#a)"/>
  <path d="M70 404 Q70 412 78 412 H292 Q300 412 300 420 V428" class="ink" marker-end="url(#a)"/>
  <g class="ink">
    <ellipse cx="70" cy="438" rx="11" ry="4"/><path d="M59 438 V460 A11 4 0 0 0 81 460 V438"/>
    <ellipse cx="300" cy="438" rx="11" ry="4"/><path d="M289 438 V460 A11 4 0 0 0 311 460 V438"/>
  </g>
  <text x="92"  y="452" class="c" style="font-size:15px">link_embeddings</text>
  <text x="92"  y="474" class="n">text and image</text>
  <text x="322" y="452" class="c" style="font-size:15px">link_passage_embeddings</text>
  <text x="322" y="474" class="n">one per passage</text>

  <text x="592" y="308" class="m">Runs on every save or edit,</text>
  <text x="592" y="330" class="m">off the request path.</text>
  <text x="592" y="352" class="m">Bursts coalesce.</text>
  <text x="592" y="384" class="m">Gemini embedding-2.</text>
  <text x="592" y="452" class="m">Passages are halfvec,</text>
  <text x="592" y="474" class="m">one row each.</text>

  <!-- II. RETRIEVE -->
  <text x="48" y="542" class="sec">II · RETRIEVE</text>
  <text x="294" y="592" class="c" text-anchor="middle" style="font-size:18px;fill:#d6d0c2">GET /search?q=</text>
  <path d="M376 586 H578" class="lead"/>
  <text x="592" y="592" class="m">Both arms run at once:</text>
  <text x="592" y="614" class="c" style="font-size:15px;fill:#a8a295">tokio::join!</text>

  <path d="M294 602 V608 Q294 616 286 616 H78 Q70 616 70 624 V638" class="ink" marker-end="url(#a)"/>
  <path d="M294 608 Q294 616 302 616 H314 Q322 616 322 624 V638" class="ink" marker-end="url(#a)"/>

  <text x="48" y="672" class="h">Lexical</text>
  <text x="48" y="706" class="c">to_tsquery + ts_rank</text>
  <text x="48" y="728" class="n">titles, tags and bodies</text>
  <text x="48" y="762" class="c">url ILIKE '%q%'</text>
  <text x="48" y="784" class="n">served by the trigram index</text>
  <text x="48" y="818" class="n" style="fill:#bfb9ab">Always runs.</text>

  <text x="300" y="672" class="h">Semantic</text>
  <text x="300" y="706" class="c">embed(q) → cosine</text>
  <text x="300" y="728" class="n">exact scan, no ANN index</text>
  <text x="300" y="762" class="c">sim ≥ floor, in gap</text>
  <text x="300" y="784" class="n">of the nearest match</text>
  <text x="300" y="818" class="n" style="fill:#bfb9ab">3 scans, ≤ 50 each.</text>

  <path d="M498 757 H578" class="lead"/>
  <text x="592" y="762" class="m">The gap drops “hub” saves</text>
  <text x="592" y="784" class="m">that sit near every query.</text>

  <path d="M70 834 V852 Q70 860 78 860 H286 Q294 860 294 868 V890" class="ink" marker-end="url(#a)"/>
  <path d="M322 834 V852 Q322 860 314 860 H302 Q294 860 294 868" class="ink"/>

  <!-- the one accent: the failure path -->
  <circle cx="322" cy="844" r="3" fill="#c8776f"/>
  <path d="M330 844 H578" fill="none" stroke="#c8776f" stroke-width="1" stroke-dasharray="1 4" stroke-linecap="round"/>
  <text x="592" y="849" class="m" style="fill:#c8776f">If it fails, times out or</text>
  <text x="592" y="871" class="m" style="fill:#c8776f">finds nothing, lexical goes</text>
  <text x="592" y="893" class="m" style="fill:#c8776f">out alone, with no error.</text>

  <text x="294" y="920" class="sec" text-anchor="middle">→ 02 · FUSE</text>
</svg>
