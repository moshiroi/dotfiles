<svg xmlns="http://www.w3.org/2000/svg" width="840" height="660" viewBox="0 0 840 660">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#a8a295" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text  { font-family: Charter, Georgia, serif; fill: #d6d0c2; }
    .title{ font-size: 34px; }
    .sub  { font-size: 18px; fill: #a8a295; }
    .sec  { font-size: 14px; letter-spacing: 2.4px; fill: #857f73; }
    .h    { font-size: 22px; }
    .n    { font-size: 16px; fill: #a8a295; }
    .m    { font-size: 16px; fill: #a8a295; }
    .c    { font-family: 'JetBrainsMono Nerd Font', Menlo, monospace; font-size: 16px; fill: #bfb9ab; font-variant-ligatures: none; }
    .ink  { fill: none; stroke: #a8a295; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: #32302d; stroke-width: 1; }
  </style>

  <rect width="840" height="660" fill="#201f1d"/>

  <text x="48" y="74" class="title">Fusing and using the results</text>
  <text x="48" y="106" class="sub">One ranked list from two, read three ways.</text>
  <line x1="48" y1="136" x2="792" y2="136" class="rule"/>
  <line x1="568" y1="160" x2="568" y2="630" class="rule"/>

  <!-- III. FUSE -->
  <text x="48" y="182" class="sec">III · FUSE</text>
  <text x="160" y="226" class="n" text-anchor="middle">lexical ranks</text>
  <text x="428" y="226" class="n" text-anchor="middle">semantic ranks</text>
  <path d="M160 238 V250 Q160 258 168 258 H286 Q294 258 294 266 V290" class="ink" marker-end="url(#a)"/>
  <path d="M428 238 V250 Q428 258 420 258 H302 Q294 258 294 266" class="ink"/>

  <text x="294" y="332" class="c" text-anchor="middle" style="font-size:22px;fill:#d6d0c2">score(id) = Σ weight / (60 + rank)</text>
  <text x="294" y="364" class="n" text-anchor="middle">ranks, never raw scores;</text>
  <text x="294" y="386" class="n" text-anchor="middle">the top 3 keyword hits stay pinned</text>

  <text x="592" y="332" class="m">Reciprocal-rank fusion.</text>
  <text x="592" y="354" class="m">Ranks compare across the</text>
  <text x="592" y="376" class="m">arms; raw scores do not.</text>

  <!-- IV. USE -->
  <text x="48" y="452" class="sec">IV · USE</text>
  <path d="M294 404 V494" class="ink" marker-end="url(#a)"/>
  <path d="M294 462 Q294 470 286 470 H138 Q130 470 130 478 V494" class="ink" marker-end="url(#a)"/>
  <path d="M294 462 Q294 470 302 470 H450 Q458 470 458 478 V494" class="ink" marker-end="url(#a)"/>

  <text x="130" y="530" class="h" text-anchor="middle">Search</text>
  <text x="130" y="558" class="n" text-anchor="middle">hits and snippets</text>
  <text x="294" y="530" class="h" text-anchor="middle">Ask</text>
  <text x="294" y="558" class="n" text-anchor="middle">nearest passages</text>
  <text x="294" y="580" class="n" text-anchor="middle">per save, budgeted,</text>
  <text x="294" y="602" class="n" text-anchor="middle">then cited</text>
  <text x="458" y="530" class="h" text-anchor="middle">Settle a page</text>
  <text x="458" y="558" class="n" text-anchor="middle">on opening a file:</text>
  <text x="458" y="580" class="n" text-anchor="middle">which page holds</text>
  <text x="458" y="602" class="n" text-anchor="middle">the words</text>

  <text x="592" y="530" class="m">Only Ask and Settle a page</text>
  <text x="592" y="552" class="m">call a language model.</text>
  <text x="592" y="574" class="m">Search never does.</text>
</svg>
